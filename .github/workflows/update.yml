name: Update profile stats

on:
  schedule:
    - cron: "7 21 * * *" # 00:07 in Nairobi
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "ascii_art.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency: update-profile

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg stats.json
          git diff --staged --quiet || git commit -m "chore: refresh profile stats"
          git push
